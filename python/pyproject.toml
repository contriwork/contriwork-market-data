[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contriwork-market-data"
description = "Unified market-data port — spot, OHLCV, order book, ticker streaming. 11 adapters: CoinGecko, CoinMarketCap, Binance, Kraken, Coinbase, Alpha Vantage, Finnhub, IEX Cloud, Polygon.io, Tiingo, YFinance. TTL cache + per-adapter rate limiting + ordered fallback. Cross-language sibling of Contriwork.MarketData (NuGet) and @contriwork/market-data (npm)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "ContriWork", email = "maintainers@contriwork.dev" }
]
keywords = [
  "market-data", "crypto", "stocks", "bist", "ohlcv", "ticker",
  "order-book", "streaming", "websocket",
  "coingecko", "coinmarketcap", "binance", "kraken", "coinbase",
  "alpha-vantage", "finnhub", "iex-cloud", "polygon", "tiingo", "yfinance",
  "contriwork",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/contriwork/contriwork-market-data"
Repository = "https://github.com/contriwork/contriwork-market-data"
Issues = "https://github.com/contriwork/contriwork-market-data/issues"
Changelog = "https://github.com/contriwork/contriwork-market-data/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[tool.hatch.version]
path = "../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/contriwork_market_data"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",        # pycodestyle + pyflakes
  "I",                  # isort
  "B",                  # bugbear
  "UP",                 # pyupgrade
  "S",                  # bandit-equivalent security checks
  "N",                  # pep8-naming
  "RUF",                # ruff-specific
  "ASYNC",              # async issues
  "SIM",                # simplify
]
ignore = ["S101"]       # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["contriwork_market_data"]
mypy_path = "src"
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: cross-language contract tests driven by contract-tests/test_cases.json",
]
